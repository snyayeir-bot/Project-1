<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSuite ERP - ចូលប្រើប្រាស់ប្រព័ន្ធ (Teacher Login)</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts (Plus Jakarta Sans & Kantumruy Pro) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-dark: #07070a;
            --bg-card: #101016;
            --bg-card-glass: rgba(16, 16, 24, 0.92);
            --border-color: rgba(212, 175, 55, 0.35);
            --accent-gold: #ffd700;
            --accent-gold-dark: #d4af37;
            --accent-gold-glow: rgba(212, 175, 55, 0.3);
            --accent-cyan: #38bdf8;
            --text-primary: #ffffff;
            --text-muted: #9e9eb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 24px 16px;
        }

        /* Ambient Animated Glows */
        .ambient-glow-1 {
            position: fixed;
            top: -140px;
            left: -140px;
            width: 520px;
            height: 520px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.18) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        .ambient-glow-2 {
            position: fixed;
            bottom: -160px;
            right: -160px;
            width: 560px;
            height: 560px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
        }

        .login-card {
            background: var(--bg-card-glass);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-color);
            border-radius: 26px;
            padding: 38px 32px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 40px var(--accent-gold-glow);
            transition: all 0.35s ease;
        }

        .login-card:hover {
            border-color: rgba(255, 215, 0, 0.55);
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.85), 0 0 50px rgba(212, 175, 55, 0.4);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .brand-icon-box {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(212, 175, 55, 0.08));
            border: 1.5px solid rgba(255, 215, 0, 0.6);
            color: var(--accent-gold);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            margin-bottom: 14px;
            box-shadow: 0 0 28px var(--accent-gold-glow);
        }

        .brand-title {
            font-size: 1.55rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .brand-subtitle {
            font-size: 0.86rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .badge-single-mode {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(212, 175, 55, 0.05));
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #ffd700;
            font-size: 0.76rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 18px;
        }

        /* Single Input Box Styling */
        .single-input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .form-label-gold {
            font-size: 0.88rem;
            font-weight: 700;
            color: #f1f1f8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-group-passcode {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-passcode-icon {
            position: absolute;
            left: 16px;
            color: #ffd700;
            font-size: 1.25rem;
            pointer-events: none;
            transition: all 0.25s ease;
        }

        .input-passcode {
            width: 100%;
            padding: 15px 48px 15px 48px;
            background: rgba(10, 10, 15, 0.95);
            border: 1.5px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            outline: none;
            transition: all 0.28s ease;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .input-passcode:focus {
            border-color: #ffd700;
            background: rgba(14, 14, 22, 0.98);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.45), inset 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .input-passcode::placeholder {
            color: #656578;
            font-weight: 500;
            font-size: 0.92rem;
            letter-spacing: normal;
        }

        .btn-clear-input {
            position: absolute;
            right: 14px;
            background: transparent;
            border: none;
            color: #7a7a90;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
            display: none;
            transition: color 0.2s;
        }

        .btn-clear-input:hover {
            color: #ffffff;
        }

        /* Submit Button */
        .btn-submit-gold {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 50%, #b8860b 100%);
            border: 1px solid rgba(255, 223, 0, 0.6);
            border-radius: 14px;
            color: #0b0b10;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 24px rgba(212, 175, 55, 0.45);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-submit-gold:hover {
            box-shadow: 0 10px 35px rgba(212, 175, 55, 0.75);
            transform: translateY(-2px);
            color: #000000;
        }

        .btn-submit-gold:active {
            transform: translateY(0);
        }

        .btn-submit-gold:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Quick Demo Teacher Codes */
        .demo-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 14px;
            margin-top: 22px;
        }

        .demo-title {
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #ffd700;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .demo-chips-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .demo-chip-btn {
            background: rgba(18, 18, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.22s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .demo-chip-btn:hover {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(212, 175, 55, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
        }

        /* Alert Toast */
        .alert-custom {
            border-radius: 12px;
            padding: 11px 16px;
            font-size: 0.85rem;
            margin-bottom: 18px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .alert-custom.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.45);
            color: #fca5a5;
            display: flex;
        }

        .alert-custom.success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.45);
            color: #6ee7b7;
            display: flex;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 0.84rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Brand Header -->
            <div class="brand-header">
                <div class="brand-icon-box">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h2 class="brand-title">EduSuite ERP</h2>
                <p class="brand-subtitle">ប្រព័ន្ធគ្រប់គ្រងសាលារៀន • កម្មវិធីគ្រប់គ្រងវត្តមាន & ពិន្ទុ</p>
                <div class="text-center mt-2">
                    <span class="badge-single-mode">
                        <i class="bi bi-key-fill"></i> Single Code Access Portal
                    </span>
                </div>
            </div>

            <!-- Alert notification -->
            <div id="alertBox" class="alert-custom">
                <i class="bi bi-info-circle-fill fs-5" id="alertIcon"></i>
                <span id="alertMsg" class="fw-semibold"></span>
            </div>

            <!-- Single Input Box Login Form -->
            <form id="singleLoginForm" onsubmit="event.preventDefault(); doSingleLogin();">
                <div class="single-input-box">
                    <label class="form-label-gold" for="passcodeInput">
                        <span><i class="bi bi-person-badge-fill text-warning me-1.5"></i>អត្តលេខគ្រូបង្រៀន (Teacher Code)</span>
                        <span class="badge bg-secondary extra-small" style="font-size:0.72rem;">1-Step Sign In</span>
                    </label>
                    <div class="input-group-passcode">
                        <i class="bi bi-key-fill input-passcode-icon"></i>
                        <input type="text" 
                            id="passcodeInput" 
                            class="input-passcode" 
                            placeholder="ឧទាហរណ៍: TCH-2026-002, TCH-2026-003" 
                            autocomplete="off"
                            autofocus 
                            required>
                        <button type="button" class="btn-clear-input" id="btnClear" onclick="clearInput()" title="សម្អាត">
                            <i class="bi bi-x-circle-fill"></i>
                        </button>
                    </div>
                    <div class="extra-small text-white-50 mt-1.5 ps-1" style="font-size: 0.76rem;">
                        <i class="bi bi-shield-check text-warning me-1"></i> បញ្ចូល <strong>teacher_code</strong> របស់លោកគ្រូ/អ្នកគ្រូដើម្បីចូលទៅកាន់គណនីភ្លាមៗ
                    </div>
                </div>

                <button type="submit" class="btn-submit-gold" id="btnSubmit">
                    <i class="bi bi-box-arrow-in-right fs-5"></i>
                    <span id="btnSubmitText">ចូលប្រើប្រាស់គណនី (Sign In)</span>
                </button>
            </form>

            <!-- Quick Demo Teacher Codes -->
            <div class="demo-section">
                <div class="demo-title">
                    <i class="bi bi-lightning-charge-fill text-warning"></i>
                    <span>ចុចលើអត្តលេខគ្រូដើម្បីសាកល្បងភ្លាមៗ (Quick Demo Codes)</span>
                </div>
                <div class="demo-chips-grid">
                    <button type="button" class="demo-chip-btn" onclick="fillCode('TCH-2026-002')">
                        <i class="bi bi-person-check-fill text-warning"></i> TCH-2026-002 (គ្រូ សារឹម)
                    </button>
                    <button type="button" class="demo-chip-btn" onclick="fillCode('TCH-2026-003')">
                        <i class="bi bi-person-check-fill text-info"></i> TCH-2026-003 (គ្រូ សានីយ៉ា)
                    </button>
                    <button type="button" class="demo-chip-btn" onclick="fillCode('TCH-2026-005')">
                        <i class="bi bi-person-check-fill text-success"></i> TCH-2026-005 (គ្រូ វ៉ាន់នី)
                    </button>
                    <button type="button" class="demo-chip-btn" onclick="fillCode('admin')">
                        <i class="bi bi-shield-lock-fill text-danger"></i> admin (Admin Boss)
                    </button>
                </div>
            </div>

            <div class="auth-footer">
                <span>មិនទាន់មានគណនីគ្រូមែនទេ? </span>
                <a href="/Register">ចុះឈ្មោះគណនីថ្មី (Register)</a>
            </div>
        </div>
    </div>

    <script>
        const passcodeInput = document.getElementById('passcodeInput');
        const btnClear = document.getElementById('btnClear');

        if (passcodeInput) {
            passcodeInput.addEventListener('input', function () {
                if (this.value.trim().length > 0) {
                    btnClear.style.display = 'block';
                } else {
                    btnClear.style.display = 'none';
                }
            });
        }

        function clearInput() {
            passcodeInput.value = '';
            btnClear.style.display = 'none';
            passcodeInput.focus();
        }

        function fillCode(code) {
            passcodeInput.value = code;
            btnClear.style.display = 'block';
            showAlert(`បានបំពេញកូដ ${code} រួចរាល់! ចុច 'ចូលប្រើប្រាស់គណនី' ដើម្បីបន្ត។`, 'success');
            passcodeInput.focus();
        }

        function showAlert(msg, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            const alertMsg = document.getElementById('alertMsg');
            const alertIcon = document.getElementById('alertIcon');

            alertBox.className = `alert-custom ${type}`;
            alertMsg.textContent = msg;
            alertIcon.className = type === 'success' ? 'bi bi-check-circle-fill text-success fs-5' : 'bi bi-exclamation-triangle-fill text-danger fs-5';
            alertBox.style.display = 'flex';
        }

        async function doSingleLogin() {
            const code = passcodeInput.value.trim();
            const btnSubmit = document.getElementById('btnSubmit');
            const btnSubmitText = document.getElementById('btnSubmitText');

            if (!code) {
                showAlert('សូមបញ្ចូលអត្តលេខគ្រូបង្រៀន (Teacher Code)!', 'error');
                passcodeInput.focus();
                return;
            }

            btnSubmit.disabled = true;
            btnSubmitText.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> កំពុងផ្ទៀងផ្ទាត់ និងចូល...`;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        code: code,
                        teacher_code: code,
                        teachers_code: code,
                        username: code,
                        name: code,
                        password: code
                    })
                });

                const data = await response.json();

                if (data.status === "success" && data.token) {
                    // Save JWT Token & User Profile to localStorage
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('token', data.token);
                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }
                    if (data.teacher) {
                        localStorage.setItem('teacher', JSON.stringify(data.teacher));
                    }

                    showAlert('ចូលប្រើប្រាស់បានជោគជ័យ! កំពុងបញ្ជូនទៅកាន់ផ្ទាំងគ្រប់គ្រង...', 'success');

                    const userRole = (data.role || (data.user && data.user.role) || '').toLowerCase();
                    const targetUrl = data.redirect_url || (userRole.includes('teacher') ? '/teachers-desbord' : '/admin-desbord');

                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 500);
                } else {
                    showAlert(data.message || 'រកមិនឃើញអត្តលេខគ្រូ ឬគណនីនេះឡើយ! សូមពិនិត្យមើលឡើងវិញ។', 'error');
                    btnSubmit.disabled = false;
                    btnSubmitText.textContent = 'ចូលប្រើប្រាស់គណនី (Sign In)';
                }
            } catch (err) {
                console.error('Login error:', err);
                showAlert('មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ម៉ាស៊ីនបម្រើ (Server Error)!', 'error');
                btnSubmit.disabled = false;
                btnSubmitText.textContent = 'ចូលប្រើប្រាស់គណនី (Sign In)';
            }
        }

        // Auto-check if already logged in with valid token
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('auth_token') || localStorage.getItem('token');
            if (token) {
                try {
                    const res = await fetch('/api/verify_token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ token })
                    });
                    const data = await res.json();
                    if (data.status === 'success' && data.user) {
                        const role = (data.user.role || '').toLowerCase();
                        if (role.includes('teacher')) {
                            window.location.href = '/teachers-desbord';
                        } else if (role.includes('admin')) {
                            window.location.href = '/admin-desbord';
                        }
                    }
                } catch (e) {
                    console.log('Session check skipped:', e);
                }
            }
        });
    </script>
</body>

</html>
